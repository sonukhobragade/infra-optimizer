name: gate

# The same checks tools/local_gate.sh runs locally. CI runs the gate script
# itself rather than repeating its steps here, so the two cannot drift apart.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the gate
        run: bash tools/local_gate.sh
